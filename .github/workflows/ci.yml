name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Version files agree
        run: make check-version
      - name: Build
        run: make build

  catalog-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check the standalone profile against the traust harness tree
        run: |
          git clone --depth 1 https://github.com/traust-security/traust.git /tmp/traust
          go run ./cmd/traust-cli catalog check --traust-root /tmp/traust
