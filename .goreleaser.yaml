version: 2

project_name: traust-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: traust-cli
    main: ./cmd/traust-cli
    binary: traust-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/traust-security/traust-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: traust-cli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
